name: ToggleGroup
tier: base
status: stable
since: E4-3
import: "@orivilo/design-system"
story: base-toggle-group
useWhen:
  - "One of a few modes: pan or select, light or dark, grid on or off"
avoidWhen:
  - "More than five options (use Select)"
contract: ToggleGroupProps
variants: [single, multiple]
sizes: [sm, md]
states: [default, hover, focus-visible, pressed, disabled]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Segmented (ORV-65, ORV-192 row 12): a sunken track; the pressed item is a raised `surface.card` chip with `text.primary` ink and a soft lift, no ring; never a tint alone, never canvas.selection, so it reads the same under every profile"
  - "`aria-label` is required because the items are usually icons"
a11y:
  - "Roving tabindex; radio semantics in single mode, aria-pressed buttons in multiple mode"
