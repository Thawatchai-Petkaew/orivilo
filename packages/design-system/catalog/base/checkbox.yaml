name: Checkbox
tier: base
status: stable
since: E2-4
import: "@orivilo/design-system"
story: base-checkbox
useWhen:
  - Zero or more of a short list, applied on submit
  - A single consent or confirmation line
avoidWhen:
  - A setting that applies immediately (Switch)
  - Exactly one of a list (RadioGroup)
contract: CheckboxProps
variants: [default]
sizes: [sm, md]
states: [default, hover, focus-visible, checked, indeterminate, disabled, invalid]
recipes: [neutral, professional, friendly]
examples:
  - src/examples/settings-form.tsx
  - src/examples/workspace.tsx
rules:
  - "Carries its own label, description and error; it is not wrapped in a Field"
  - Checked state is a glyph plus fill, never fill alone
  - Label is part of the hit area
  - "sm for tables and dense lists (ORV-72); a table's selection column uses sm"
a11y:
  - Indeterminate exposed with aria-checked="mixed"
  - "sm keeps a 24 px target around its 16 px box when the label is visually hidden (WCAG 2.5.8)"
