name: PasswordInput
tier: base
status: draft
since: ORV-67
import: "@orivilo/design-system"
story: base-password-input
useWhen:
  - "Entering a password or a secret the user may need to check"
avoidWhen:
  - "A one-time code or PIN"
  - "A value that is not secret (Input)"
contract: PasswordInputProps
variants: [default]
sizes: [sm, md, lg]
states: [default, hover, focus-visible, disabled, invalid, revealed]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Built on InputGroup; the reveal toggle sits in the end slot, so it has no end or shortcut prop"
  - "The toggle is a real button with aria-pressed, named for what pressing it does: show password, then hide password, in Thai and English"
  - "Hidden by default; the state is not remembered and the value is never logged"
  - "Inside a Field it takes the label, description, error and required wiring from context"
a11y:
  - "A pointer press never moves focus out of the field; a keyboard press keeps focus on the button the user tabbed to"
  - "The type switches between password and text; a screen reader hears the button name and its pressed state"
