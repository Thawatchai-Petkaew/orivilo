name: Resizable
tier: base
status: draft
since: E4-4
import: "@orivilo/design-system"
story: base-resizable
useWhen:
  - "Side panels the user widens: block library, inspector"
avoidWhen:
  - "Fixed layouts"
contract: ResizableProps
variants: [start, end]
sizes: []
states: [default, handle-hover, handle-focus-visible, dragging, collapsed]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Width and collapsed state persist in this browser under `storageKey`; a collapsed panel keeps a reopen control visible"
  - "Bounds come from the resizable tokens (240, 320, 480 px) unless the props set them"
  - "Built in house (a window splitter for one side panel), no dependency"
a11y:
  - "The handle is a focusable separator: arrows resize by 16 px, Page keys by 160 px, Home and End jump to the bounds, Enter hides the panel"
  - "Reopening moves focus back to the handle"
