name: Switch
tier: base
status: draft
since: ORV-249
import: "@orivilo/design-system"
story: base-switch
useWhen:
  - "An on/off setting that applies immediately, where the caller saves it and shows whether it took"
avoidWhen:
  - "An on/off applied when the form is submitted (Checkbox)"
  - "A single consent or confirmation line, such as accepting terms (Checkbox)"
  - "A choice between two named options (RadioGroup)"
  - "A menu item (a checkbox item in the menu)"
contract: SwitchProps
variants: []
sizes: [sm, md]
states: [default, hover, pressed, focus-visible, on, disabled, invalid, saving]
recipes: [neutral, professional, friendly]
examples:
  - src/examples/settings-form.tsx
rules:
  - 'Has no label of its own: inside `Field orientation="horizontal"` the Field''s label names it, and outside a Field it takes `aria-label` or `aria-labelledby`'
  - "The label names the setting and never changes with the state; no story or component prints the state as a word"
  - "Two states only, off and on; no mixed state and no slim form"
  - "The component makes no request: the caller passes `checked` as controlled state and owns the save"
  - "`saving` turns a ring in the thumb and stops a click and Space or Enter, with focus kept; on failure the caller sets `checked` back, ends `saving` and gives the Field an `error` that says how to retry; on success the ring goes and the thumb stays, with no tick and no saved word"
  - "`disabled` wins over `saving`; disabled reads tokens, never opacity"
  - "On reads the selection tokens, never action.primary; the thumb's place carries the state with the colour"
  - "A horizontal Field needs a width (a form column): with none the switch sits at the far end of the line"
a11y:
  - "Role switch with `aria-checked`; Space and Enter toggle; a click on the label toggles it and a click on the description does not"
  - 'While saving the button has `aria-busy` and `aria-disabled` and stays focusable; one `role="status"` beside it holds the saving word; the ring is hidden from assistive technology'
  - "`aria-invalid` sits on the switch, and the error is `Field`'s alert, read in the switch's description"
  - "`sm` keeps a 24 px target around its 20 px track (WCAG 2.5.8)"
