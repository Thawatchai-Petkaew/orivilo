name: Slider
tier: base
status: draft
since: E4-4
import: "@orivilo/design-system"
story: base-slider
useWhen:
  - "A bounded numeric value with immediate visual effect: density, strength, zoom"
avoidWhen:
  - "Exact values typed by the user (pair with Input or use Input alone)"
contract: SliderProps
variants: []
sizes: [md]
states: [default, hover, focus-visible, dragging, disabled]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Shows the current value as text next to the track, formatted by `format`"
  - "`onValueCommit` fires once on release, for work too costly to run on every step"
a11y:
  - "Arrow keys step; Page keys step by 10; Home and End jump to the bounds; the value is announced with aria-valuetext"
