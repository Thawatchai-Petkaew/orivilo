name: Popover
tier: base
status: stable
since: E2-4
import: "@orivilo/design-system"
story: base-popover
useWhen:
  - "A small task anchored to a trigger: a picker, a quick form, the chat opened at the cursor"
avoidWhen:
  - "A decision that must finish first (use Dialog)"
  - "A plain label (use Tooltip)"
contract: PopoverProps
variants: []
sizes: []
states: [closed, open, pending]
recipes: [neutral, professional, friendly]
examples: [] # the reference screen (E2-8) is the first
rules:
  - "PopoverTrigger and PopoverClose default to asChild so a Button keeps its recipe"
  - "Rendered through the portal with the same DesignProfileBoundary as the trigger (PortalScope); the InsideProfile story proves it"
a11y:
  - "Focus moves inside on open and returns on close; Escape closes"
