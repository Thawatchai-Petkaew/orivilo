name: Kbd
tier: base
status: stable
since: E4-3
import: "@orivilo/design-system"
story: base-kbd
useWhen:
  - "A keyboard shortcut hint in a menu, tooltip, or the shortcut sheet"
avoidWhen:
  - "Body copy"
contract: KbdProps
variants: []
sizes: [sm]
states: [default, apple, arrows, named-keys]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Keys come from the command registry; the modifier renders as Cmd on macOS and Ctrl elsewhere, Alt as Option on macOS"
  - "Moved from E4-5 to E4-3 because the menus and the sheet need it"
a11y:
  - "Rendered as kbd elements; arrows draw as glyphs with their Thai names for screen readers; `shortcutWords` gives the spoken form for a tooltip or description"
