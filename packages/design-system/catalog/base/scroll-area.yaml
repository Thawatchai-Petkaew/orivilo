name: ScrollArea
tier: base
status: draft
since: E4-4
import: "@orivilo/design-system"
story: base-scroll-area
useWhen:
  - "A panel with its own scroll: block library, inspector, task bar list"
avoidWhen:
  - "The page itself"
contract: ScrollAreaProps
variants: []
sizes: []
states: [default, scrolling]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Scrollbar styled from tokens; it shows whenever the content overflows, so it never hides from the keyboard"
  - "`orientation` names the overflow: vertical (default), horizontal or both"
a11y:
  - "The viewport is a focusable region named by `label`; arrows scroll it"
