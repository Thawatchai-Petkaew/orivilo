name: Select
tier: base
status: stable
since: E2-4
import: "@orivilo/design-system"
story: base-select
useWhen:
  - Pick one of six or more known options that need no search
avoidWhen:
  - Five or fewer options that should all be visible (RadioGroup)
  - Long lists that need search or async loading (Combobox)
contract: SelectProps
variants: [default]
sizes: [sm, md, lg]
states: [default, hover, focus-visible, open, disabled, invalid, empty]
recipes: [neutral, professional, friendly]
examples:
  - src/examples/settings-form.tsx
  - src/examples/workspace.tsx
rules:
  - "options is an array; an empty array shows emptyText instead of a blank listbox"
  - "The listbox re-opens the trigger's profile through PortalScope (E2-4); the InsideProfile story proves it"
  - Selected option uses surface.selected and selection.fg, distinct from focus
a11y:
  - Keyboard: arrows, type-ahead, Escape closes and returns focus
