name: Tag
tier: base
status: draft
since: E4-5
import: "@orivilo/design-system"
story: base-tag
useWhen:
  - "A removable label chosen by the user: a reference, a filter, a mention"
avoidWhen:
  - "Read-only status (use Badge)"
contract: TagProps
variants: []
sizes: [sm, md]
states: [default, hover, focus-visible, selected, disabled]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Remove is a real button beside the label with its own accessible name, never nested in the toggle"
  - "A selectable tag (`selected`, `defaultSelected` or `onSelectedChange`) is a toggle button; selected adds a check and a heavier edge, not colour alone"
  - "A long label truncates with the full text in `title`"
  - "Style A, soft pill (ORV-192 row 13): sunken fill, `border.subtle` hairline, label in `type.body.sm` (md) or `type.body.xs` (sm) at weight 400; the remove is a round button inside the pill"
  - "Hover shows on the edge of a selectable tag only; the fill never changes on hover"
a11y:
  - 'Remove button reachable by keyboard and named "Remove {label}" from the locale catalog'
  - "Selectable tag exposes aria-pressed; Space and Enter toggle"
