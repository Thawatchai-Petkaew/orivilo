name: CanvasNode
tier: application
status: stable
since: E4-2
import: "@orivilo/design-system"
story: application-canvas-node
useWhen:
  - "Anything placed on the board: an input block, a knowledge node, an artifact, a reference, a direction, a note"
avoidWhen:
  - "Content that is not addressable by the engine (put it in a note)"
contract: CanvasNodeProps
variants: [input-block, knowledge, artifact, reference, direction, note]
sizes: [sm, md, lg]
states:
  [
    default,
    hover,
    selected,
    focus-visible,
    dragging,
    running,
    stale,
    locked,
    error,
    missing-inputs,
    collapsed,
    read-only,
    fill-empty,
    fill-partial,
    fill-summarized,
    fill-unlinked,
  ]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "One surface, no header band: a glass frame 4 px inside the edge (ORV-59) holds the kind icon, kind, status, run time and title; body is a slot per variant; a divider sits above the ports, which are words (ORV-57)"
  - "Running turns the AI gradient ring and colours the step icons with it; steps and run time show only when the run reports them; still under reduced motion"
  - "A new result is a new node linked to its source; a node is never overwritten in place"
  - "A node outside the block registry lists its missing inputs on the node (ขาดข้อมูล)"
  - "A node made from a registry block derives its fill state from its answers and edges (ORV-44 part 2): empty has a dashed frame and asks its first question; partial counts what is left; summarized and unlinked show the rule-based summary (up to three lines, swatches for colours), labelled ตามกฎ"
  - "A note a chat reply placed (ORV-106) carries NodeContent.basis: its header says ตามกฎ or ข้อมูลจำลอง after the kind word, plain text in the kind ink, never a chip; it is never marked done or approved"
  - "Stale means an upstream node changed after this one ran; shown with an edge and a word, not a tint"
  - "A note is glass, like the toolbar (owner's choice, ORV-56); every other kind is solid. Solid under reduced transparency"
a11y:
  - "Accessible name is title, kind (Thai word); aria-busy while running"
  - "Every action on the node also exists in the command registry; NodeToolbar and the resizer arrive in E4-3"
  - "Ports are lists named พอร์ตรับ and พอร์ตส่ง; a locked or read-only node disables them"
