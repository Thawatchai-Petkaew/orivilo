name: CanvasNode
tier: application
status: planned
since: E4-2
import: none
story: application-canvas-node
useWhen:
  - "Anything placed on the board: an input block, a knowledge node, an artifact, a reference, a direction, a note"
avoidWhen:
  - "Content that is not addressable by the engine (put it in a note)"
contract: CanvasNodeProps
variants: [input-block, knowledge, artifact, reference, direction, note]
sizes: [sm, md, lg, custom]
states:
  [
    default,
    hover,
    selected,
    focus-visible,
    dragging,
    running,
    stale,
    locked,
    error,
    missing-inputs,
    collapsed,
    read-only,
  ]
recipes: []
examples: []
rules:
  - "Header shows title, kind and status; body is a slot per variant; footer shows ports"
  - "A new result is a new node linked to its source; a node is never overwritten in place"
  - "Missing inputs are listed on the node and asked one at a time in the Inspector"
  - "Stale means an upstream node changed after this one ran; shown with an edge and a word, not a tint"
a11y:
  - "Accessible name is title plus kind"
  - "Every action on the node also exists in NodeToolbar and the command registry"
  - "Resize handles are focusable"
