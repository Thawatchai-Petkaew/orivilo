name: CanvasNode
tier: application
status: stable
since: E4-2
import: "@orivilo/design-system"
story: application-canvas-node
useWhen:
  - "Anything placed on the board: an input block, a knowledge node, an artifact, a reference, a direction, a note"
avoidWhen:
  - "Content that is not addressable by the engine (put it in a note)"
contract: CanvasNodeProps
variants: [input-block, knowledge, artifact, reference, direction, note]
sizes: [sm, md, lg]
states:
  [
    default,
    hover,
    selected,
    focus-visible,
    dragging,
    running,
    stale,
    locked,
    error,
    missing-inputs,
    collapsed,
    read-only,
    fill-empty,
    fill-partial,
    fill-summarized,
    fill-unlinked,
    present,
    open,
    media-pad,
  ]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "One surface, no header band: a glass frame 4 px inside the edge (ORV-59) holds the kind icon, kind, status, run time and title; body is a slot per variant; a divider sits above the ports, which are words (ORV-57)"
  - "Running turns the AI gradient ring and colours the step icons with it; steps and run time show only when the run reports them; still under reduced motion"
  - "A new result is a new node linked to its source; a node is never overwritten in place"
  - "A node outside the block registry lists its missing inputs on the node (ขาดข้อมูล)"
  - "A node made from a registry block derives its fill state from its answers and edges (ORV-44 part 2): empty has a dashed frame and asks its first question; partial counts what is left; summarized and unlinked show the rule-based summary (up to three lines, swatches for colours), labelled ตามกฎ"
  - "A note a chat reply placed (ORV-106) carries NodeContent.basis: its header says ตามกฎ or ข้อมูลจำลอง after the kind word, plain text in the kind ink, never a chip; it is never marked done or approved"
  - "Stale means an upstream node changed after this one ran; shown with an edge and a word, not a tint"
  - "A note is glass, like the toolbar (owner's choice, ORV-56); every other kind is solid. Solid under reduced transparency"
  - "On a present board (board.readOnly) a node is one card with a border.subtle hairline in both modes: its kind glyph, title, basis and status are a label above the card, one line that never passes the card: parts leave from the end, whole (open glyph, pages, status word, status glyph, basis), and the title keeps min(4em, the line) with an ellipsis; the label grows by 1 / zoom below zoom 1 so it stays legible. Hover takes node.border-hover; selected takes node.border-selected plus a 1 px inner outline (offset -2); keyboard focus keeps its own line and halo outside, so it never reads as selection. The kind word, the header band and the footer are gone (ORV-274; stories PresentStates, Present, PresentNarrowLabels)"
  - "On a present board a card with side ports is at least 2 x node.radius + (n - 1) x space.grid-gap + size.port high, n the larger side's count of ports without row, so every dot sits on the straight part of its side (ORV-274)"
  - "NodeContent.source is a pill under the present card (text.secondary on surface.card) that shows on hover, selection and keyboard focus; NodeContent.pad is `text` (padding node.padding, 16) or `media` (node.padding-media, 8, with the body slot rounded to the node radius less that) (ORV-274)"
  - "NodeContent.open ({ count? }) makes a node that opens something: the wrapper takes aria-haspopup=dialog, the cursor is zoom-in, and CanvasBoard.onNodeOpen is called with its id. With a count the accessible name is `graph.nodeOpenLabel` (title and page count) and the title row ends with the pages word (node.pages) and the open glyph on both boards (ORV-274; story CanvasBoard OpenNode). Without a count the node opens one view, not pages: the title row ends with the open glyph only, no pages word, and the accessible name is `graph.nodeLabel` (nodeOpenLabel returns nodeLabel) (ORV-282; story CanvasNode OpenWithoutCount)"
  - "A port with `row` sits at the middle of the body element that carries the same data-port-row, measured on the card and again when it resizes (ORV-274; story PresentRowPorts)"
a11y:
  - "Accessible name is title, kind (Thai word); aria-busy while running"
  - "Every action on the node also exists in the command registry; NodeToolbar and the resizer arrive in E4-3"
  - "Ports are lists named พอร์ตรับ and พอร์ตส่ง; a locked or read-only node disables them"
