name: EmptyState
tier: application
status: draft
since: ORV-223
import: "@orivilo/design-system"
story: application-empty-state
useWhen:
  - "A board, a list or a panel has nothing in it and the person can do something about it: first use, or a search that found nothing"
avoidWhen:
  - "A failed load (use Alert, an empty form is not an error form)"
  - "A wait (use Spinner, SkeletonGroup or the loading pattern, never both at once)"
  - "A table's own empty row (Table keeps its status row until it moves here)"
contract: EmptyStateProps
variants: []
sizes: [sm, md]
states: [first-use, no-results, title-only]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "`title` and `level` are required: the title is the heading element of `level` (2 to 6, `h1` is the page's own), and the description is a `p`; there is no `main`, `header`, `footer`, `section` or `role` on any part"
  - "The words come from the caller in the person's language; EmptyState holds no catalog key and no fixed text"
  - "`action` is the caller's own Button, one at most, and it names its outcome; a person who cannot act gets none, not a disabled one. Keep the label short: a Button label does not wrap"
  - "`icon` is a glyph component from `icons.tsx`, drawn on a neutral FeaturedIcon at the tile size of `size` (md 40, sm 32); the tile is quieter than the action and the words carry the meaning"
  - "`md` is a centred column capped at `size.panel.default` (320): tile, 16, text, 16, action. `sm` starts at the line's start: tile, 12, then the text with the action 8 under it; the title's first line centres on the tile at any line count"
  - "Title over text is the compact form of DESIGN.md section 4: 14 / 500 in `text.primary` over 14 / 400 in `text.secondary`, 4 px apart. Long words break by `overflow-wrap: anywhere`; nothing is clamped. No animation, no transition"
  - "It never speaks and never takes focus: no live role, no `tabindex`, no `autoFocus`. A region that was already empty on first render says nothing; one that turns empty by a search or a change the person did not make owns a status container mounted before the words, and puts the form in it (the NoResults story); one that turns empty by the person's own delete lets its existing status line say so. On the last item leaving, the region keeps the keyboard (empty-live-1, empty-focus-1)"
  - "Which one to use: a whole region with no known layout takes the loading pattern, a region with a known layout takes SkeletonGroup, a row or a control takes Spinner, a job with a known length takes Progress; EmptyState replaces the content, never sits beside a wait (load-use-1)"
  - "The words and the actions in the stories are mock: no press starts a job or adds a node"
a11y:
  - "The title is a heading of the caller's level, so the region can be reached by heading; the tile is hidden from assistive technology"
  - "No screen reader test has been run; the rules above rest on the W3C pages read (ORV-223 spec, K-0178), not on a measured announcement"
