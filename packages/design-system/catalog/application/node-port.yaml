name: NodePort
tier: application
status: stable
since: E4-2
import: "@orivilo/design-system"
story: application-node-port
useWhen:
  - "A connection point on a node, typed by the data it carries: text, image, palette, type, profile"
avoidWhen:
  - "Decorative dots"
contract: NodePortProps
variants: [input, output]
sizes: [md]
states: [idle, hover, connecting, valid-target, invalid-target, connected, disabled]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Kind is shown by shape (circle, square, diamond, triangle, hexagon) and label as well as colour"
  - "States: connecting, valid-target and invalid-target follow the pointer drag and the keyboard connection; connected and disabled come from the graph"
  - "Dragging from a port lists only compatible nodes (Krea pattern); an invalid drop explains why"
a11y:
  - "Keyboard connect: C on a focused node starts a connection, arrow keys pick a target, Enter confirms, Escape cancels"
  - "The handle carries the accessible name: direction and kind (พอร์ตรับข้อความ), then เชื่อมอยู่ or แก้ไขไม่ได้"
