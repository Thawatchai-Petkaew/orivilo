name: CanvasBoard
tier: application
status: stable
since: E4-2
import: "@orivilo/design-system"
story: application-canvas-board
useWhen:
  - "The Intent Studio board: blocks, nodes, groups and edges on an infinite surface"
avoidWhen:
  - "A list or a form would do"
  - "A customer preview (that is a node's content, not a board)"
contract: CanvasBoardProps
variants: [edit, present]
sizes: []
states: [empty, loading, ready, read-only, connecting, box-selecting]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Behavior from React Flow (ADR 0004); every visual value from tokens, the React Flow theme CSS is not loaded"
  - "Wrapped in DesignProfileBoundary with the neutral profile; customer profiles appear only inside preview nodes"
  - "Never randomizes layout; positions are saved with the board"
  - "Controlled: the graph comes in through `graph` and every change goes out through `onChange`; `onCommand` hands the shell what the board cannot finish (add node, rename, undo, redo)"
  - "Deleting a node marks every downstream node and its outgoing edges stale, never deletes them"
  - "The present variant shows the words ดูอย่างเดียว and allows only focus and jump"
  - "With no node the overlay draws an EmptyState (md, level 2) with an artifact tile, `emptyText` or the catalog's board.empty as the title, and `emptyAction`, the host's own Button (`empty-board-1`); nothing is spoken at first render. When a delete leaves no node the status line says what went and the region takes focus; the action is reached by Tab after the toolbar. The form sits on the board's centre and rises only as far as it must to stay `space.inset.md` above the toolbar, or above the shelf when one is mounted, and `space.stack.sm` above a one line status, and with the task bar's panel open `space.inset.md` above the bar, the action stopping `space.inset.md` under the board's top; a host `status` that wraps still reaches the action, and a board too short for the form cuts the tile first. Browsers without anchor positioning top align the form. Every action in the stories is mock"
a11y:
  - "Tab moves through nodes and edges; arrow keys nudge the selection by one grid unit, Shift by ten; Escape clears selection; every key comes from the command registry through src/commands/generated.ts"
  - "C on a focused node starts a keyboard connection; the live region reads the target, Enter connects, Escape cancels"
  - "One live region (role status) reads what happened: connected, deleted, stale, nudged, or why a drop was refused"
  - "Pan and zoom without a pointer arrive with CanvasControls (E4-3)"
