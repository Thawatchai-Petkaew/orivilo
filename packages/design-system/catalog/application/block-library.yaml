name: BlockLibrary
tier: application
status: draft
since: E4-4
import: "@orivilo/design-system"
story: application-block-library
useWhen:
  - "The shelf of every block the board can hold, at the bottom of the board: search, place, see what each block already knows"
avoidWhen:
  - "Listing nodes already on the board for navigation (use the command menu's node search)"
contract: BlockLibraryProps
variants: []
sizes: []
states: [absent, empty, partial, summarized, unlinked, search-empty, read-only]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Blocks come from the registry (catalog/blocks/mvp.yaml); no tile is listed by hand"
  - "Each tile shows its state from the board's data as a word and a mark, never a guess and never colour alone; a summarized colour block shows its swatches"
  - "Drag to the board to place at the drop point; Enter or click places at the viewport centre; a block already on the board is selected and fitted, never added twice"
  - "Glass like the toolbar, solid under reduced transparency; sits 16 px above the board controls at any row count"
  - "Centred on the board with equal gaps to both edges, 16 px at its widest, on the controls and task bar start edge; the focus ring of the first and last tile stays whole in the scrolling row"
  - "Renders inside CanvasBoard (its children); the shell owns the graph and adds the node through onPlace (placeBlock builds it)"
  - "Title over supporting text (ORV-192 row 17): one size, title 500 in the ground's primary ink, text 400 in its secondary ink, 4 px apart"
a11y:
  - "A group named by its heading; search is a labelled searchbox; tiles are one Tab stop with arrow keys, Home and End between them"
  - "Placing is announced in a status line; Mod+Enter (panel.place-block) also places"
