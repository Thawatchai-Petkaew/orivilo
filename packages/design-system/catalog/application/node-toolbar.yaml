name: NodeToolbar
tier: application
status: stable
since: E4-3
import: "@orivilo/design-system"
story: application-node-toolbar
useWhen:
  - "Actions for the one selected node: duplicate, lock or unlock, collapse or expand, delete now; generate, open, send to compare in their stories"
avoidWhen:
  - "More than six actions (the rest go behind more)"
contract: NodeToolbarProps
variants: []
sizes: []
states: [visible, multi-select, disabled-while-running, locked]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Does not scale with zoom (React Flow NodeToolbar)"
  - "Hidden when several nodes are selected and in the present variant; selection actions live in the CanvasContextMenu"
  - "Items are the registry's node-toolbar commands available in this build; the destructive one sits last; every button runs through the board's one runner"
  - "Glass over the board (toolbar.opacity, toolbar.blur); solid under prefers-reduced-transparency"
a11y:
  - "Toolbar role named after the node; each button named by its command with the shortcut in the tooltip and aria-keyshortcuts"
