name: NodeGroup
tier: application
status: stable
since: E4-3
import: "@orivilo/design-system"
story: application-node-group
useWhen:
  - "A named frame around related nodes: a mood board, a storyboard, one direction"
avoidWhen:
  - "A single node"
contract: NodeGroupProps
variants: []
sizes: []
states: [default, selected, collapsed, read-only]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "A group is a BoardNode with type group and kind group, placed before its children; children keep positions relative to it and move with it; a child dragged out leaves it"
  - "Mod+G groups two or more selected nodes (named กลุ่ม N); Mod+Shift+G ungroups; deleting a group ungroups it and keeps every node"
  - "Collapsing hides the children and shows how many nodes and crossing edges it holds; the frame is restored on expand"
a11y:
  - "A focusable node named by its title and the word กลุ่ม; its toolbar appears when it is the one selected node; children are reachable in the board's focus order"
