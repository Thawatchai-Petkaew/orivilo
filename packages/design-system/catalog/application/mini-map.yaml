name: MiniMap
tier: application
status: stable
since: E4-3
import: "@orivilo/design-system"
story: application-mini-map
useWhen:
  - "Boards larger than one viewport"
avoidWhen:
  - "Fewer than ten nodes (hidden unless toggled)"
contract: MiniMapProps
variants: []
sizes: []
states: [shown, hidden, selected-and-group]
recipes: [neutral, professional, friendly]
examples: []
rules:
  - "Fills come from the minimap tokens through the recipe (node, selected node, group); the viewport mask in canvas.selection"
  - "The board shows it from ten nodes (MINIMAP_FROM); Shift+M and the control toggle it; `minimap` on the board forces it"
a11y:
  - "Named for screen readers (an image) but decorative: no keyboard path, the same navigation exists in CanvasControls"
